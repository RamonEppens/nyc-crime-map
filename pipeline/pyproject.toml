[project]
name = "nyc-crime-map-pipeline"
version = "0.1.0"
description = "Data pipeline for the NYC Crime Map (NYPD Complaint Data from NYC Open Data)"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=17",
    "requests>=2.32",
    "shapely>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "xlrd>=2.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
